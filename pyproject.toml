[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-paper-wiki"
version = "0.1.0"
description = "Local, source-traceable paper workflow for Codex and LLM Wiki"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.25,<2", "PyYAML>=6,<7", "markdown-it-py>=3,<5"]

[project.scripts]
paper-wiki = "paperwiki.cli:main"

[tool.setuptools.packages.find]
include = ["paperwiki*"]
